<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR-Тайник: Рациональные числа</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background: #000; }
        .hud {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            z-index: 20; background: rgba(15, 23, 42, 0.9); color: #fff;
            padding: 10px 18px; border-radius: 14px; border: 2px solid #38bdf8;
            text-align: center; min-width: 280px; max-width: 92vw;
        }
        .hud .stats { font-size: 13px; color: #94a3b8; }
        .hud .task { font-size: 20px; font-weight: bold; margin-top: 3px; }
        .hud .sub { font-size: 12px; color: #7dd3fc; margin-top: 2px; }

        .bottom-panel {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            z-index: 20; display: flex; flex-wrap: wrap; gap: 8px;
            justify-content: center; width: 94vw; max-width: 440px;
        }
        .ans-btn {
            flex: 1 1 42%; padding: 12px 10px; font-size: 18px; font-weight: bold;
            border: none; border-radius: 12px; color: #fff; background: #0284c7;
            cursor: pointer;
        }
        #openBtn {
            width: 100%; padding: 13px; font-size: 16px; font-weight: bold;
            border: none; border-radius: 12px; color: #fff; background: #16a34a;
            cursor: pointer;
        }
        #openBtn:disabled {
            background: #475569;
            color: #cbd5e1;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="hud">
    <div class="stats">Очки: <span id="score">0</span> | Решено: <span id="solved">0</span></div>
    <div class="task" id="taskText">Метка не найдена</div>
    <div class="sub" id="subText">Наведите камеру на маркер HIRO</div>
</div>

<div class="bottom-panel" id="panel">
    <button id="openBtn" disabled>Сначала найдите метку HIRO</button>
</div>

<a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; alpha: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-marker preset="hiro" id="hiroMarker">
        <!-- Платформа на маркере -->
        <a-box position="0 0.03 0" width="1.1" depth="1.1" height="0.06" color="#1e293b"></a-box>

        <!-- Тайник-куб -->
        <a-box id="cacheBox" position="0 0.34 0" width="0.45" height="0.45" depth="0.45"
               color="#f59e0b" material="roughness: 0.35; metalness: 0.15"></a-box>

        <!-- 4 сферы с вариантами ответа -->
        <a-sphere id="s0" position="-0.75 0.68 0" radius="0.22" color="#0ea5e9" visible="false">
            <a-text id="t0" value="" align="center" color="#fff" position="0 0 0.24" scale="1.2 1.2 1.2"></a-text>
        </a-sphere>
        <a-sphere id="s1" position="0.75 0.68 0" radius="0.22" color="#8b5cf6" visible="false">
            <a-text id="t1" value="" align="center" color="#fff" position="0 0 0.24" scale="1.2 1.2 1.2"></a-text>
        </a-sphere>
        <a-sphere id="s2" position="-0.75 0.28 0.55" radius="0.22" color="#ec4899" visible="false">
            <a-text id="t2" value="" align="center" color="#fff" position="0 0 0.24" scale="1.2 1.2 1.2"></a-text>
        </a-sphere>
        <a-sphere id="s3" position="0.75 0.28 0.55" radius="0.22" color="#10b981" visible="false">
            <a-text id="t3" value="" align="center" color="#fff" position="0 0 0.24" scale="1.2 1.2 1.2"></a-text>
        </a-sphere>
    </a-marker>

    <a-entity camera></a-entity>
</a-scene>

<script>
    const marker = document.getElementById('hiroMarker');
    const cacheBox = document.getElementById('cacheBox');
    const openBtn = document.getElementById('openBtn');
    const panel = document.getElementById('panel');
    const taskText = document.getElementById('taskText');
    const subText = document.getElementById('subText');
    const scoreEl = document.getElementById('score');
    const solvedEl = document.getElementById('solved');

    let score = 0;
    let solved = 0;
    let currentCorrect = null;
    let isOpened = false;
    let markerVisible = false;

    function syncButtonState() {
        if (isOpened) return;
        if (markerVisible) {
            openBtn.disabled = false;
            openBtn.innerText = "Раскрыть тайник и получить пример";
            taskText.innerText = "Тайник найден на маркере!";
            subText.innerText = "Нажмите кнопку внизу, чтобы открыть тайник";
        } else {
            openBtn.disabled = true;
            openBtn.innerText = "Сначала найдите метку HIRO";
            taskText.innerText = "Метка не найдена";
            subText.innerText = "Наведите камеру на маркер HIRO";
        }
    }

    marker.addEventListener('markerFound', () => {
        markerVisible = true;
        syncButtonState();
    });

    marker.addEventListener('markerLost', () => {
        markerVisible = false;
        syncButtonState();
    });

    function generateQuestion() {
        const type = Math.floor(Math.random() * 3);
        let a, b, text, ans;

        if (type === 0) {
            a = Math.floor(Math.random() * 25) - 12;
            b = Math.floor(Math.random() * 25) - 12;
            if (b === 0) b = 4;
            ans = a + b;
            text = b < 0 ? `${a} + (${b})` : `${a} + ${b}`;
        } else if (type === 1) {
            a = Math.floor(Math.random() * 21) - 10;
            b = Math.floor(Math.random() * 21) - 10;
            if (b === 0) b = -3;
            ans = a - b;
            text = b < 0 ? `${a} - (${b})` : `${a} - ${b}`;
        } else {
            a = (Math.floor(Math.random() * 16) - 8) / 2;
            b = (Math.floor(Math.random() * 16) - 8) / 2;
            ans = +(a + b).toFixed(1);
            text = `${a.toString().replace('.', ',')} + (${b.toString().replace('.', ',')})`;
        }

        return { text: `${text} = ?`, ans };
    }

    function renderAnswerButtons(options) {
        panel.querySelectorAll('.ans-btn').forEach(btn => btn.remove());
        options.forEach((val, idx) => {
            const label = val.toString().replace('.', ',');
            document.getElementById(`s${idx}`).setAttribute('visible', 'true');
            document.getElementById(`t${idx}`).setAttribute('value', label);

            const btn = document.createElement('button');
            btn.className = 'ans-btn';
            btn.innerText = label;
            btn.addEventListener('click', () => handleAnswer(val));
            panel.appendChild(btn);
        });
    }

    function closeCache() {
        isOpened = false;
        currentCorrect = null;
        cacheBox.setAttribute('color', '#f59e0b');
        for (let i = 0; i < 4; i++) {
            document.getElementById(`s${i}`).setAttribute('visible', 'false');
        }
        panel.querySelectorAll('.ans-btn').forEach(btn => btn.remove());
        openBtn.style.display = 'block';
        syncButtonState();
    }

    function handleAnswer(chosen) {
        if (chosen === currentCorrect) {
            score += 15;
            solved += 1;
            scoreEl.innerText = score;
            solvedEl.innerText = solved;
            cacheBox.setAttribute('color', '#22c55e');
            subText.innerText = "Верно! +15 очков";
            setTimeout(closeCache, 1000);
        } else {
            score = Math.max(0, score - 5);
            scoreEl.innerText = score;
            cacheBox.setAttribute('color', '#ef4444');
            subText.innerText = "Неверно! -5 очков";
        }
    }

    openBtn.addEventListener('click', () => {
        if (!markerVisible || isOpened) return;
        isOpened = true;
        openBtn.style.display = 'none';
        cacheBox.setAttribute('color', '#38bdf8');

        const q = generateQuestion();
        currentCorrect = q.ans;
        taskText.innerText = q.text;
        subText.innerText = "Выберите правильный ответ";

        const opts = new Set([q.ans]);
        while (opts.size < 4) {
            let delta = Math.floor(Math.random() * 7) - 3;
            if (delta === 0) delta = 4;
            let fake = Number.isInteger(q.ans) ? q.ans + delta : +(q.ans + delta * 0.5).toFixed(1);
            opts.add(fake);
        }

        renderAnswerButtons(Array.from(opts).sort(() => Math.random() - 0.5));
    });
</script>
</body>
</html>
