<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR-Охота: Рациональные числа</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        /* Видео с камеры на весь экран */
        #camera {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        /* Игровой слой поверх камеры */
        #gameCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }
        /* Верхняя панель с заданием и счетом */
        .hud {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(6px);
            color: #fff;
            padding: 12px 24px;
            border-radius: 16px;
            border: 2px solid #38bdf8;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            min-width: 260px;
        }
        .hud .stats {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .hud .task {
            font-size: 26px;
            font-weight: bold;
            color: #f8fafc;
        }
        /* Стартовый экран */
        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: rgba(15, 23, 42, 0.95);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        #startScreen h1 { font-size: 28px; margin-bottom: 12px; color: #38bdf8; }
        #startScreen p { font-size: 16px; color: #cbd5e1; max-width: 340px; margin-bottom: 25px; line-height: 1.4; }
        button {
            padding: 15px 32px;
            font-size: 18px;
            font-weight: bold;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.5);
        }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>

<div id="startScreen">
    <h1>AR-Математика</h1>
    <p>Наводите прицел камеры на летающие сферы с правильными ответами или нажимайте на них прямо на экране!</p>
    <button id="startBtn">Запустить камеру и игру</button>
</div>

<video id="camera" autoplay playsinline></video>
<canvas id="gameCanvas"></canvas>

<div class="hud" id="hud" style="display:none;">
    <div class="stats">Счёт: <span id="score">0</span> | Вопрос: <span id="qNum">1</span>/10</div>
    <div class="task" id="taskText">-12 + 7 = ?</div>
</div>

<script>
    const video = document.getElementById('camera');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const hud = document.getElementById('hud');
    const taskText = document.getElementById('taskText');
    const scoreEl = document.getElementById('score');
    const qNumEl = document.getElementById('qNum');

    let width, height;
    let score = 0;
    let questionCount = 1;
    let currentCorrect = 0;
    let targets = [];
    let particles = [];
    let flashColor = null;

    // Гироскоп для смещения объектов при повороте телефона (эффект пространства)
    let tiltX = 0, tiltY = 0;
    let baseBeta = null, baseGamma = null;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Генератор примеров по теме сложения и вычитания рациональных чисел
    function generateQuestion() {
        const type = Math.floor(Math.random() * 3);
        let a, b, text, ans;

        if (type === 0) {
            // Целые отрицательные и положительные
            a = Math.floor(Math.random() * 31) - 15;
            b = Math.floor(Math.random() * 31) - 15;
            if (b === 0) b = 4;
            ans = a + b;
            text = b < 0 ? `${a} + (${b})` : `${a} + ${b}`;
        } else if (type === 1) {
            // Вычитание
            a = Math.floor(Math.random() * 25) - 12;
            b = Math.floor(Math.random() * 25) - 12;
            if (b === 0) b = -3;
            ans = a - b;
            text = b < 0 ? `${a} - (${b})` : `${a} - ${b}`;
        } else {
            // Десятичные дроби (один знак после запятой)
            a = (Math.floor(Math.random() * 20) - 10) / 2;
            b = (Math.floor(Math.random() * 20) - 10) / 2;
            ans = +(a + b).toFixed(1);
            const aStr = a.toString().replace('.', ',');
            const bStr = b.toString().replace('.', ',');
            text = b < 0 ? `${aStr} + (${bStr})` : `${aStr} + ${bStr}`;
        }

        currentCorrect = ans;
        taskText.innerText = `${text} = ?`;
        spawnTargets(ans);
    }

    function spawnTargets(correctAns) {
        targets = [];
        let options = new Set([correctAns]);
        while (options.size < 4) {
            let offset = (Math.floor(Math.random() * 9) - 4);
            if (offset === 0) offset = 5;
            let fake = Number.isInteger(correctAns)
                ? correctAns + offset
                : +(correctAns + offset * 0.5).toFixed(1);
            options.add(fake);
        }

        const optArray = Array.from(options).sort(() => Math.random() - 0.5);
        const colors = ['#0ea5e9', '#8b5cf6', '#ec4899', '#f59e0b'];

        optArray.forEach((val, i) => {
            targets.push({
                value: val,
                label: val.toString().replace('.', ','),
                x: width * (0.2 + i * 0.2),
                y: height * (0.35 + (i % 2) * 0.25),
                vx: (Math.random() - 0.5) * 1.6,
                vy: (Math.random() - 0.5) * 1.6,
                r: 44,
                color: colors[i % colors.length],
                hoverTime: 0
            });
        });
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 18; i++) {
            const angle = (Math.PI * 2 / 18) * i;
            const speed = 2 + Math.random() * 4;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: 1,
                color
            });
        }
    }

    function checkAnswer(target) {
        if (target.value === currentCorrect) {
            score += 10;
            flashColor = 'rgba(34, 197, 94, 0.35)';
            createExplosion(target.x + tiltX, target.y + tiltY, '#22c55e');
        } else {
            score = Math.max(0, score - 5);
            flashColor = 'rgba(239, 68, 68, 0.35)';
            createExplosion(target.x + tiltX, target.y + tiltY, '#ef4444');
        }
        scoreEl.innerText = score;
        questionCount++;
        qNumEl.innerText = questionCount;
        generateQuestion();
    }

    // Клик / тап прямо по сфере
    canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;

        for (let t of targets) {
            const dx = px - (t.x + tiltX);
            const dy = py - (t.y + tiltY);
            if (Math.hypot(dx, dy) <= t.r + 10) {
                checkAnswer(t);
                break;
            }
        }
    });

    function loop() {
        ctx.clearRect(0, 0, width, height);

        // Вспышка экрана при ответе
        if (flashColor) {
            ctx.fillStyle = flashColor;
            ctx.fillRect(0, 0, width, height);
            flashColor = null;
        }

        const cx = width / 2;
        const cy = height / 2;

        // Отрисовка сфер-мишеней
        targets.forEach(t => {
            t.x += t.vx;
            t.y += t.vy;

            if (t.x < t.r + 20 || t.x > width - t.r - 20) t.vx *= -1;
            if (t.y < 120 || t.y > height - t.r - 30) t.vy *= -1;

            const drawX = t.x + tiltX;
            const drawY = t.y + tiltY;

            // Проверка наведения центрального прицела на сферу
            const distToCenter = Math.hypot(drawX - cx, drawY - cy);
            if (distToCenter < t.r) {
                t.hoverTime += 1;
                if (t.hoverTime > 45) { // ~0.75 сек удержания прицела
                    checkAnswer(t);
                    return;
                }
            } else {
                t.hoverTime = Math.max(0, t.hoverTime - 2);
            }

            // Тень и шар
            ctx.beginPath();
            ctx.arc(drawX, drawY, t.r, 0, Math.PI * 2);
            ctx.fillStyle = t.color;
            ctx.globalAlpha = 0.88;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();

            // Кольцо прогресса захвата прицелом
            if (t.hoverTime > 0) {
                ctx.beginPath();
                ctx.arc(drawX, drawY, t.r + 7, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2) * (t.hoverTime / 45));
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#fde047';
                ctx.stroke();
            }

            // Текст числа внутри шара
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(t.label, drawX, drawY);
        });

        // Частицы взрыва
        particles.forEach((p, idx) => {
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= 0.03;
            if (p.alpha <= 0) {
                particles.splice(idx, 1);
                return;
            }
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        });

        // Центральный AR-прицел
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(cx, cy, 18, 0, Math.PI * 2);
        ctx.moveTo(cx - 26, cy); ctx.lineTo(cx - 10, cy);
        ctx.moveTo(cx + 10, cy); ctx.lineTo(cx + 26, cy);
        ctx.moveTo(cx, cy - 26); ctx.lineTo(cx, cy - 10);
        ctx.moveTo(cx, cy + 10); ctx.lineTo(cx, cy + 26);
        ctx.stroke();

        requestAnimationFrame(loop);
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' }, // Тыльная (основная) камера
                audio: false
            });
            video.srcObject = stream;
        } catch (err) {
            alert('Не удалось включить камеру (возможно, открыто не по HTTPS или запрещён доступ). Игра запустится на тёмном фоне.');
        }

        // Подключаем гироскоп, если устройство поддерживает
        if (window.DeviceOrientationEvent) {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
            }
            window.addEventListener('deviceorientation', (e) => {
                if (e.beta === null || e.gamma === null) return;
                if (baseBeta === null) { baseBeta = e.beta; baseGamma = e.gamma; }
                tiltX = Math.max(-120, Math.min(120, (e.gamma - baseGamma) * 3));
                tiltY = Math.max(-120, Math.min(120, (e.beta - baseBeta) * 3));
            });
        }

        startScreen.style.display = 'none';
        hud.style.display = 'block';
        generateQuestion();
        loop();
    });
</script>
</body>
</html>
