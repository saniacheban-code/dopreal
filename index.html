<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математика 6 класс: Верно / Неверно</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
        }
        body {
            background-color: #1e293b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            background: #0f172a;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
        }
        h1 {
            font-size: 28px;
            color: #38bdf8;
        }
        .legend {
            font-size: 22px;
            display: flex;
            gap: 20px;
        }
        .legend span {
            padding: 5px 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        .sit-badge { background: #2563eb; }
        .stand-badge { background: #d97706; }

        .screen {
            display: none;
            width: 100%;
            max-width: 1280px;
            padding: 20px;
            flex-direction: column;
            align-items: center;
        }
        .screen.active {
            display: flex;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            max-width: 900px;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 18px 26px;
            font-size: 26px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover { background: #1d4ed8; }
        .btn-green { background: #16a34a; }
        .btn-green:hover { background: #15803d; }
        .btn-orange { background: #ea580c; }
        .btn-orange:hover { background: #c2410c; }

        .question-box {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            padding: 18px 28px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        .question-meta {
            font-size: 20px;
            color: #475569;
            margin-bottom: 6px;
        }
        .question-text {
            font-size: 34px;
            font-weight: bold;
        }
        .timer-bar-container {
            width: 100%;
            height: 14px;
            background: #e2e8f0;
            border-radius: 7px;
            margin-top: 14px;
            overflow: hidden;
        }
        .timer-bar {
            height: 100%;
            width: 100%;
            background: #2563eb;
            transition: width 0.1s linear;
        }

        .video-wrapper {
            position: relative;
            width: 960px;
            max-width: 95vw;
            height: 540px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 4px solid #334155;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .debug-bar {
            margin-top: 10px;
            font-size: 18px;
            color: #94a3b8;
            text-align: center;
        }

        .controls {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }
        .status-msg {
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #fbbf24;
        }

        .frac {
            display: inline-block;
            vertical-align: middle;
            text-align: center;
            font-size: 0.85em;
            margin: 0 4px;
        }
        .frac > span { display: block; padding: 0 4px; }
        .frac span.bottom { border-top: 2px solid #0f172a; }
    </style>
</head>
<body>

    <header>
        <h1>Математика 6 класс: Встань или Сиди</h1>
        <div class="legend">
            <span class="sit-badge">СИДИМ = ВЕРНО</span>
            <span class="stand-badge">ВСТАЕМ = НЕВЕРНО</span>
        </div>
    </header>

    <div id="menu-screen" class="screen active">
        <h2 style="font-size: 32px; margin-top: 20px;">Выберите тему урока:</h2>
        <div class="topic-grid">
            <button class="btn" onclick="selectTopic('rational')">1. Рациональные числа и модули</button>
            <button class="btn" onclick="selectTopic('proportions')">2. Отношения и пропорции</button>
            <button class="btn" onclick="selectTopic('equations')">3. Линейные уравнения</button>
            <button class="btn" onclick="selectTopic('fractions')">4. Действия с дробями</button>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div class="question-box">
            <div class="question-meta" id="q-counter">Запуск камеры...</div>
            <div class="question-text" id="q-text">Попросите учеников сесть за парты и смотреть в камеру</div>
            <div class="timer-bar-container">
                <div class="timer-bar" id="timer-bar"></div>
            </div>
        </div>

        <div class="video-wrapper">
            <video id="input-video" autoplay playsinline muted></video>
            <canvas id="output-canvas" width="960" height="540"></canvas>
        </div>

        <div class="debug-bar" id="debug-bar">Диагностика: ожидание доступа к камере...</div>

        <div class="controls">
            <div class="status-msg" id="status-msg">Шаг 1: Нажмите «Запомнить сидячие места», когда класс сядет.</div>
            <button class="btn btn-orange" id="calibrate-btn" onclick="calibrateSeats()">Запомнить сидячие места</button>
            <button class="btn btn-green" id="start-q-btn" onclick="startQuestion()" style="display:none;">Начать вопрос</button>
            <button class="btn" id="next-q-btn" onclick="nextQuestion()" style="display:none;">Следующий вопрос ➔</button>
            <button class="btn" style="background:#475569; padding: 14px 20px; font-size: 22px;" onclick="location.reload()">В меню</button>
        </div>
    </div>

    <script>
        const questionsDB = {
            rational: [
                { text: "Модуль отрицательного числа всегда является числом положительным.", answer: true },
                { text: "Число -15 больше, чем число -8.", answer: false },
                { text: "Сумма двух противоположных чисел всегда равна нулю.", answer: true },
                { text: "|-7| + |-3| = -10", answer: false },
                { text: "Число 0 является положительным числом.", answer: false },
                { text: "Произведение двух отрицательных чисел — число положительное.", answer: true }
            ],
            proportions: [
                { text: "Пропорция — это равенство двух отношений.", answer: true },
                { text: "В верной пропорции произведение крайних членов равно сумме средних.", answer: false },
                { text: "Равенство 2 : 5 = 4 : 10 является верной пропорцией.", answer: true },
                { text: "Скорость и время при постоянном пути — прямо пропорциональные величины.", answer: false },
                { text: "Если x : 3 = 10 : 6, то x = 5.", answer: true }
            ],
            equations: [
                { text: "Корень уравнения 2x + 6 = 0 равен -3.", answer: true },
                { text: "При переносе слагаемого из одной части уравнения в другую его знак не меняется.", answer: false },
                { text: "Уравнение 0 · x = 5 имеет бесконечно много корней.", answer: false },
                { text: "Если -x = -12, то x = 12.", answer: true },
                { text: "Решением уравнения 3(x - 1) = 9 является число 4.", answer: true }
            ],
            fractions: [
                { text: `Дробь <div class="frac"><span>3</span><span class="bottom">4</span></div> равна десятичной дроби 0,75.`, answer: true },
                { text: `Чтобы разделить дробь на дробь, нужно числитель умножить на числитель, а знаменатель на знаменатель.`, answer: false },
                { text: `Сумма <div class="frac"><span>1</span><span class="bottom">2</span></div> + <div class="frac"><span>1</span><span class="bottom">3</span></div> равна <div class="frac"><span>2</span><span class="bottom">5</span></div>.`, answer: false },
                { text: `Произведение взаимно обратных чисел равно 1.`, answer: true },
                { text: `Дробь <div class="frac"><span>12</span><span class="bottom">18</span></div> после сокращения равна <div class="frac"><span>2</span><span class="bottom">3</span></div>.`, answer: true }
            ]
        };

        let currentQuestions = [];
        let currentIndex = 0;
        let baselineFaces = [];
        let latestDetections = [];
        let gameState = 'CALIBRATION';
        let timerInterval = null;
        let useFallbackMotion = false;
        let prevFrameData = null;

        const videoElement = document.getElementById('input-video');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const debugBar = document.getElementById('debug-bar');

        // Вспомогательный канвас для анализа движения при запасном режиме
        const motionCanvas = document.createElement('canvas');
        motionCanvas.width = 160;
        motionCanvas.height = 90;
        const motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true });

        let faceDetection = null;
        try {
            if (typeof FaceDetection !== 'undefined') {
                faceDetection = new FaceDetection({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
                });
                faceDetection.setOptions({
                    model: 'full',
                    minDetectionConfidence: 0.3
                });
                faceDetection.onResults(onFaceResults);
            } else {
                useFallbackMotion = true;
            }
        } catch (err) {
            useFallbackMotion = true;
        }

        function selectTopic(topicKey) {
            currentQuestions = questionsDB[topicKey];
            currentIndex = 0;
            document.getElementById('menu-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            initCamera();
        }

        async function initCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                debugBar.innerText = "Ошибка: браузер не поддерживает камеру или страница открыта без HTTPS/localhost.";
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
                    audio: false
                });
                videoElement.srcObject = stream;
                await videoElement.play();

                debugBar.innerText = useFallbackMotion
                    ? "Камера активна | Режим: детектор движения (MediaPipe недоступен)"
                    : "Камера активна | Режим: распознавание лиц MediaPipe";

                requestAnimationFrame(processLoop);
            } catch (err) {
                debugBar.innerText = `Ошибка доступа к камере: ${err.name} — ${err.message}. Запустите через локальный сервер или GitHub Pages и разрешите камеру.`;
            }
        }

        let isSendingFrame = false;

        async function processLoop() {
            if (videoElement.readyState >= 2) {
                if (!useFallbackMotion && faceDetection && !isSendingFrame) {
                    isSendingFrame = true;
                    try {
                        await faceDetection.send({ image: videoElement });
                    } catch (e) {
                        useFallbackMotion = true;
                        debugBar.innerText = "Переключено на запасной детектор движения";
                    } finally {
                        isSendingFrame = false;
                    }
                } else if (useFallbackMotion) {
                    runMotionFallback();
                }
            }
            requestAnimationFrame(processLoop);
        }

        function onFaceResults(results) {
            latestDetections = results.detections || [];
            debugBar.innerText = `Камера активна | Найдено лиц в кадре: ${latestDetections.length}`;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            latestDetections.forEach((detection) => {
                const bbox = detection.boundingBox;
                const x = (bbox.xCenter - bbox.width / 2) * canvasElement.width;
                const y = (bbox.yCenter - bbox.height / 2) * canvasElement.height;
                const w = bbox.width * canvasElement.width;
                const h = bbox.height * canvasElement.height;

                let strokeColor = '#38bdf8';
                let fillColor = 'rgba(56, 189, 248, 0.15)';

                if (gameState === 'COUNTDOWN' || gameState === 'RESULT') {
                    const isStanding = checkIfStanding(bbox);
                    const studentAnswer = !isStanding;

                    if (gameState === 'COUNTDOWN') {
                        strokeColor = isStanding ? '#f59e0b' : '#3b82f6';
                        fillColor = isStanding ? 'rgba(245, 158, 11, 0.25)' : 'rgba(59, 130, 246, 0.25)';
                    } else if (gameState === 'RESULT') {
                        const correctAnswer = currentQuestions[currentIndex].answer;
                        const isCorrect = (studentAnswer === correctAnswer);
                        strokeColor = isCorrect ? '#22c55e' : '#ef4444';
                        fillColor = isCorrect ? 'rgba(34, 197, 94, 0.45)' : 'rgba(239, 68, 68, 0.45)';
                    }
                }

                canvasCtx.fillStyle = fillColor;
                canvasCtx.fillRect(x - 10, y - 10, w + 20, h + 40);
                canvasCtx.lineWidth = 5;
                canvasCtx.strokeStyle = strokeColor;
                canvasCtx.strokeRect(x - 10, y - 10, w + 20, h + 40);
            });

            canvasCtx.restore();
        }

        // Запасной режим по сетке зон кадра, если MediaPipe не загрузился
        function runMotionFallback() {
            motionCtx.drawImage(videoElement, 0, 0, motionCanvas.width, motionCanvas.height);
            const frame = motionCtx.getImageData(0, 0, motionCanvas.width, motionCanvas.height).data;

            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (prevFrameData && (gameState === 'COUNTDOWN' || gameState === 'RESULT')) {
                const cols = 6;
                const rows = 3;
                const cellW = motionCanvas.width / cols;
                const cellH = motionCanvas.height / rows;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        let diffSum = 0;
                        let count = 0;
                        for (let y = Math.floor(r * cellH); y < Math.floor((r + 1) * cellH); y += 2) {
                            for (let x = Math.floor(c * cellW); x < Math.floor((c + 1) * cellW); x += 2) {
                                const idx = (y * motionCanvas.width + x) * 4;
                                const diff = Math.abs(frame[idx] - prevFrameData[idx]) +
                                             Math.abs(frame[idx + 1] - prevFrameData[idx + 1]) +
                                             Math.abs(frame[idx + 2] - prevFrameData[idx + 2]);
                                diffSum += diff;
                                count++;
                            }
                        }
                        const avgDiff = diffSum / Math.max(1, count);
                        if (avgDiff > 45) {
                            const drawX = (c / cols) * canvasElement.width;
                            const drawY = (r / rows) * canvasElement.height;
                            const drawW = canvasElement.width / cols;
                            const drawH = canvasElement.height / rows;
                            canvasCtx.strokeStyle = '#f59e0b';
                            canvasCtx.lineWidth = 3;
                            canvasCtx.strokeRect(drawX, drawY, drawW, drawH);
                        }
                    }
                }
            }
            prevFrameData = new Uint8ClampedArray(frame);
        }

        function calibrateSeats() {
            if (useFallbackMotion) {
                baselineFaces = [{ calibrated: true }];
                document.getElementById('status-msg').innerText = "Режим движения откалиброван. Можно начинать!";
                document.getElementById('start-q-btn').style.display = "inline-block";
                return;
            }

            if (latestDetections.length === 0) {
                alert("Пока не видно ни одного лица. Проверьте, что камера направлена на класс, хорошее освещение и разрешение камеры в браузере.");
                return;
            }

            baselineFaces = latestDetections.map(d => ({
                xCenter: d.boundingBox.xCenter,
                yCenter: d.boundingBox.yCenter,
                height: d.boundingBox.height
            }));

            document.getElementById('status-msg').innerText = `Запомнено лиц: ${baselineFaces.length}. Готовы начать!`;
            document.getElementById('calibrate-btn').innerText = "Перекалибровать";
            document.getElementById('start-q-btn').style.display = "inline-block";
        }

        function checkIfStanding(currentBbox) {
            if (baselineFaces.length === 0) return false;
            let closestSeat = null;
            let minDistX = Infinity;

            for (let seat of baselineFaces) {
                const distX = Math.abs(seat.xCenter - currentBbox.xCenter);
                if (distX < minDistX) {
                    minDistX = distX;
                    closestSeat = seat;
                }
            }

            if (closestSeat && minDistX < 0.14) {
                const liftAmount = closestSeat.yCenter - currentBbox.yCenter;
                const threshold = closestSeat.height * 0.55;
                return liftAmount > threshold;
            }
            return false;
        }

        function startQuestion() {
            if (currentIndex >= currentQuestions.length) {
                finishGame();
                return;
            }

            gameState = 'COUNTDOWN';
            document.getElementById('start-q-btn').style.display = 'none';
            document.getElementById('next-q-btn').style.display = 'none';
            document.getElementById('calibrate-btn').style.display = 'none';

            const q = currentQuestions[currentIndex];
            document.getElementById('q-counter').innerText = `Вопрос ${currentIndex + 1} из ${currentQuestions.length}`;
            document.getElementById('q-text').innerHTML = q.text;
            document.getElementById('status-msg').innerText = "Думаем! Сидим = ВЕРНО, Встаем = НЕВЕРНО";

            let timeLeft = 10.0;
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.background = '#2563eb';
            timerBar.style.width = '100%';

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                const percent = Math.max(0, (timeLeft / 10) * 100);
                timerBar.style.width = percent + '%';
                if (timeLeft <= 3) timerBar.style.background = '#ef4444';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    evaluateAnswers();
                }
            }, 100);
        }

        function evaluateAnswers() {
            gameState = 'RESULT';
            const q = currentQuestions[currentIndex];
            const rightAction = q.answer ? "ВЕРНО (нужно было СИДЕТЬ)" : "НЕВЕРНО (нужно было ВСТАТЬ)";
            document.getElementById('status-msg').innerText = `Ответ: ${rightAction}`;
            document.getElementById('next-q-btn').style.display = 'inline-block';
            document.getElementById('calibrate-btn').style.display = 'inline-block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                startQuestion();
            } else {
                finishGame();
            }
        }

        function finishGame() {
            gameState = 'CALIBRATION';
            document.getElementById('q-counter').innerText = "Игра завершена!";
            document.getElementById('q-text').innerText = "Отличная работа! Все вопросы по теме пройдены.";
            document.getElementById('status-msg').innerText = "Выберите другую тему в меню.";
            document.getElementById('next-q-btn').style.display = 'none';
        }
    </script>
</body>
</html>
