<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Geo-Тайники: Подойди ногами</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: #0f172a; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff;
        }
        #camera {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; opacity: 0.55;
        }
        .overlay {
            position: relative; z-index: 2; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 16px;
        }
        .card {
            background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(8px);
            border: 2px solid #38bdf8; border-radius: 16px; padding: 14px 18px;
            text-align: center;
        }
        .stats { font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
        .dist { font-size: 26px; font-weight: 800; color: #38bdf8; margin: 4px 0; }
        .task { font-size: 21px; font-weight: bold; margin-top: 6px; }
        .sub { font-size: 13px; color: #cbd5e1; margin-top: 4px; }

        .actions { display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; }
        button {
            flex: 1 1 45%; padding: 13px 14px; font-size: 16px; font-weight: bold;
            border: none; border-radius: 12px; cursor: pointer; color: #fff;
            background: #0284c7;
        }
        button.green { background: #16a34a; width: 100%; flex: 1 1 100%; }
        button.gray { background: #334155; font-size: 13px; padding: 10px; }
        button:disabled { background: #475569; color: #cbd5e1; cursor: not-allowed; }
    </style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>

<div class="overlay">
    <div class="card">
        <div class="stats">Очки: <span id="score">0</span> | Тайник: <span id="cacheNum">1</span>/3</div>
        <div class="dist" id="distanceText">-- м</div>
        <div class="task" id="taskText">Ожидание GPS...</div>
        <div class="sub" id="subText">Подойдите ногами ближе 6 м, чтобы открыть тайник</div>
    </div>

    <div class="actions">
        <div id="answerButtons" class="row"></div>
        <button class="green" id="openBtn" disabled>Подойдите ближе к тайнику</button>
        <div class="row">
            <button class="gray" id="simNearBtn">Тест: поставить тайник в 3 м</button>
            <button class="gray" id="nextCacheBtn">Следующий тайник</button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('camera');
    const distanceText = document.getElementById('distanceText');
    const taskText = document.getElementById('taskText');
    const subText = document.getElementById('subText');
    const scoreEl = document.getElementById('score');
    const cacheNumEl = document.getElementById('cacheNum');
    const openBtn = document.getElementById('openBtn');
    const answerButtons = document.getElementById('answerButtons');

    const UNLOCK_RADIUS_METERS = 6;
    let score = 0;
    let currentIdx = 0;
    let userPos = null;
    let caches = [];
    let currentCorrect = null;
    let openedCurrent = false;

    // Расстояние между двумя GPS-координатами в метрах (формула гаверсинуса)
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const toRad = d => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a = Math.sin(dLat / 2) ** 2 +
                  Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                  Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Смещение координат на dNorth (м) и dEast (м) от точки старта
    function offsetCoords(lat, lon, dNorth, dEast) {
        const dLat = dNorth / 111320;
        const dLon = dEast / (111320 * Math.cos(lat * Math.PI / 180));
        return { lat: lat + dLat, lon: lon + dLon };
    }

    function createCachesAround(lat, lon) {
        caches = [
            { ...offsetCoords(lat, lon,  12,   5), solved: false },
            { ...offsetCoords(lat, lon,  -8,  14), solved: false },
            { ...offsetCoords(lat, lon,  18, -10), solved: false }
        ];
    }

    function generateQuestion() {
        const type = Math.floor(Math.random() * 3);
        let a, b, text, ans;
        if (type === 0) {
            a = Math.floor(Math.random() * 25) - 12;
            b = Math.floor(Math.random() * 25) - 12;
            if (b === 0) b = 4;
            ans = a + b;
            text = b < 0 ? `${a} + (${b})` : `${a} + ${b}`;
        } else if (type === 1) {
            a = Math.floor(Math.random() * 21) - 10;
            b = Math.floor(Math.random() * 21) - 10;
            if (b === 0) b = -3;
            ans = a - b;
            text = b < 0 ? `${a} - (${b})` : `${a} - ${b}`;
        } else {
            a = (Math.floor(Math.random() * 16) - 8) / 2;
            b = (Math.floor(Math.random() * 16) - 8) / 2;
            ans = +(a + b).toFixed(1);
            text = `${a.toString().replace('.', ',')} + (${b.toString().replace('.', ',')})`;
        }
        return { text: `${text} = ?`, ans };
    }

    function updateUI() {
        cacheNumEl.innerText = currentIdx + 1;
        const c = caches[currentIdx];
        if (!userPos || !c) return;

        const dist = getDistanceMeters(userPos.lat, userPos.lon, c.lat, c.lon);
        distanceText.innerText = `${dist.toFixed(1)} м`;

        if (openedCurrent) return;

        if (dist <= UNLOCK_RADIUS_METERS) {
            openBtn.disabled = false;
            openBtn.innerText = "Открыть тайник (вы в зоне)";
            taskText.innerText = "Тайник рядом!";
            subText.innerText = "Нажмите кнопку, чтобы раскрыть задание";
        } else {
            openBtn.disabled = true;
            openBtn.innerText = `Подойдите ближе (нужно <= ${UNLOCK_RADIUS_METERS} м)`;
            taskText.innerText = "Идите к тайнику";
            subText.innerText = `Осталось пройти около ${Math.max(0, Math.round(dist - UNLOCK_RADIUS_METERS))} м`;
        }
    }

    openBtn.addEventListener('click', () => {
        if (openBtn.disabled || openedCurrent) return;
        openedCurrent = true;
        openBtn.style.display = 'none';
        answerButtons.innerHTML = '';

        const q = generateQuestion();
        currentCorrect = q.ans;
        taskText.innerText = q.text;
        subText.innerText = "Выберите верный ответ";

        const opts = new Set([q.ans]);
        while (opts.size < 4) {
            let delta = Math.floor(Math.random() * 7) - 3;
            if (delta === 0) delta = 4;
            let fake = Number.isInteger(q.ans) ? q.ans + delta : +(q.ans + delta * 0.5).toFixed(1);
            opts.add(fake);
        }

        Array.from(opts).sort(() => Math.random() - 0.5).forEach(val => {
            const btn = document.createElement('button');
            btn.innerText = val.toString().replace('.', ',');
            btn.addEventListener('click', () => {
                if (val === currentCorrect) {
                    score += 20;
                    scoreEl.innerText = score;
                    subText.innerText = "Верно! +20 очков";
                } else {
                    score = Math.max(0, score - 5);
                    scoreEl.innerText = score;
                    subText.innerText = "Неверно! -5 очков";
                }
                answerButtons.innerHTML = '';
                openedCurrent = false;
                openBtn.style.display = 'block';
                currentIdx = (currentIdx + 1) % caches.length;
                updateUI();
            });
            answerButtons.appendChild(btn);
        });
    });

    // Кнопка для проверки механики открытия, не выходя из помещения
    document.getElementById('simNearBtn').addEventListener('click', () => {
        if (!userPos) {
            userPos = { lat: 52.54, lon: 62.50 };
            createCachesAround(userPos.lat, userPos.lon);
        }
        const near = offsetCoords(userPos.lat, userPos.lon, 3, 0);
        caches[currentIdx].lat = near.lat;
        caches[currentIdx].lon = near.lon;
        openedCurrent = false;
        openBtn.style.display = 'block';
        answerButtons.innerHTML = '';
        updateUI();
    });

    document.getElementById('nextCacheBtn').addEventListener('click', () => {
        currentIdx = (currentIdx + 1) % caches.length;
        openedCurrent = false;
        openBtn.style.display = 'block';
        answerButtons.innerHTML = '';
        updateUI();
    });

    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: false
            });
            video.srcObject = stream;
        } catch (e) {}

        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    if (!userPos) {
                        userPos = { lat: latitude, lon: longitude };
                        createCachesAround(latitude, longitude);
                    } else {
                        userPos = { lat: latitude, lon: longitude };
                    }
                    updateUI();
                },
                (err) => {
                    taskText.innerText = "GPS недоступен или запрещён";
                    subText.innerText = "Можно нажать «Тест: поставить тайник в 3 м» для проверки";
                },
                { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
            );
        }
    }

    init();
</script>
</body>
</html>
