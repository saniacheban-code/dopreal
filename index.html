<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D AR-Тайники: Пространство</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: #000; font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        #camera {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
        }
        #threeCanvas {
            position: fixed; inset: 0; width: 100%; height: 100%;
            z-index: 2;
        }
        .hud {
            position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
            z-index: 5; background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(8px); color: #fff;
            padding: 12px 20px; border-radius: 16px;
            border: 2px solid #38bdf8; text-align: center;
            min-width: 280px; max-width: 92vw; pointer-events: none;
        }
        .hud .stats { font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
        .hud .task { font-size: 22px; font-weight: bold; color: #f8fafc; min-height: 28px; }
        .hud .sub { font-size: 13px; color: #7dd3fc; margin-top: 4px; }

        /* Центральный прицел для понимания, куда направлен взгляд */
        #reticle {
            position: fixed; top: 50%; left: 50%;
            width: 18px; height: 18px; margin: -9px 0 0 -9px;
            border: 2px solid rgba(255, 255, 255, 0.75);
            border-radius: 50%; z-index: 4; pointer-events: none;
        }

        .controls {
            position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
            z-index: 5; display: flex; gap: 10px; align-items: center;
        }
        .ctrl-btn {
            padding: 11px 16px; font-size: 14px; font-weight: bold;
            border: none; border-radius: 12px; cursor: pointer;
            color: #fff; background: rgba(2, 132, 199, 0.92);
            box-shadow: 0 4px 14px rgba(0,0,0,0.45);
        }
        .ctrl-btn.secondary {
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid #475569;
        }
        .ctrl-btn:active { transform: scale(0.96); }

        #feedback {
            position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%);
            z-index: 6; font-size: 26px; font-weight: 800;
            padding: 12px 24px; border-radius: 16px;
            display: none; pointer-events: none; text-align: center;
        }

        #startScreen {
            position: fixed; inset: 0; z-index: 10;
            background: rgba(15, 23, 42, 0.96); color: #fff;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 24px; text-align: center;
        }
        #startScreen h1 { color: #38bdf8; font-size: 26px; margin-bottom: 12px; }
        #startScreen p { color: #cbd5e1; max-width: 360px; line-height: 1.45; margin-bottom: 22px; }
        #startBtn {
            padding: 15px 30px; font-size: 18px; font-weight: bold;
            background: #0284c7; color: #fff; border: none; border-radius: 12px;
            cursor: pointer;
        }
    </style>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>

<div id="startScreen">
    <h1>3D AR-Тайники</h1>
    <p>Ведите пальцем по экрану (или поворачивайте телефон), чтобы осматриваться вокруг. Тайники стоят на тумбах и за колоннами на расстоянии — подойдите ближе, чтобы открыть их и решить пример.</p>
    <button id="startBtn">Запустить камеру</button>
</div>

<video id="camera" autoplay playsinline muted></video>
<canvas id="threeCanvas"></canvas>
<div id="reticle" style="display:none;"></div>

<div class="hud" id="hud" style="display:none;">
    <div class="stats">Очки: <span id="score">0</span> | Открыто: <span id="foundCount">0</span>/<span id="totalCount">4</span></div>
    <div class="task" id="taskText">Осмотритесь вокруг</div>
    <div class="sub" id="subText">Свайпните для обзора • «Шаг вперёд» для приближения</div>
</div>

<div id="feedback"></div>

<div class="controls" id="controls" style="display:none;">
    <button class="ctrl-btn" id="stepFwdBtn">Шаг вперёд</button>
    <button class="ctrl-btn secondary" id="stepBackBtn">Назад</button>
    <button class="ctrl-btn secondary" id="resetPosBtn">Старт</button>
</div>

<script>
    const video = document.getElementById('camera');
    const canvas = document.getElementById('threeCanvas');
    const reticle = document.getElementById('reticle');
    const startScreen = document.getElementById('startScreen');
    const hud = document.getElementById('hud');
    const controls = document.getElementById('controls');
    const taskText = document.getElementById('taskText');
    const subText = document.getElementById('subText');
    const scoreEl = document.getElementById('score');
    const foundCountEl = document.getElementById('foundCount');
    const totalCountEl = document.getElementById('totalCount');
    const feedbackEl = document.getElementById('feedback');

    let scene, camera3D, renderer, raycaster;
    let caches = [];
    let answerSpheres = [];
    let activeCache = null;
    let currentCorrect = 0;

    let score = 0;
    let foundTotal = 0;

    // Углы обзора камеры в мировых координатах
    let yaw = 0;
    let pitch = 0;
    let gyroOffsetYaw = 0, gyroOffsetPitch = 0;
    let lastGyroBeta = null, lastGyroGamma = null;

    // Для свайпа и отличия тапа от перетаскивания
    let isDragging = false;
    let dragMoved = false;
    let prevX = 0, prevY = 0;

    function showFeedback(text, good = true) {
        feedbackEl.innerText = text;
        feedbackEl.style.display = 'block';
        feedbackEl.style.background = good ? 'rgba(22, 163, 74, 0.92)' : 'rgba(220, 38, 38, 0.92)';
        feedbackEl.style.color = '#fff';
        setTimeout(() => { feedbackEl.style.display = 'none'; }, 1100);
    }

    function generateMathQuestion() {
        const type = Math.floor(Math.random() * 3);
        let a, b, text, ans;

        if (type === 0) {
            a = Math.floor(Math.random() * 25) - 12;
            b = Math.floor(Math.random() * 25) - 12;
            if (b === 0) b = 4;
            ans = a + b;
            text = b < 0 ? `${a} + (${b})` : `${a} + ${b}`;
        } else if (type === 1) {
            a = Math.floor(Math.random() * 21) - 10;
            b = Math.floor(Math.random() * 21) - 10;
            if (b === 0) b = -3;
            ans = a - b;
            text = b < 0 ? `${a} - (${b})` : `${a} - ${b}`;
        } else {
            a = (Math.floor(Math.random() * 16) - 8) / 2;
            b = (Math.floor(Math.random() * 16) - 8) / 2;
            ans = +(a + b).toFixed(1);
            text = `${a.toString().replace('.', ',')} + (${b.toString().replace('.', ',')})`;
        }

        return { text: `${text} = ?`, ans };
    }

    function makeSphereTexture(label, bgColor) {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        const g = c.getContext('2d');

        const grad = g.createRadialGradient(85, 80, 18, 128, 128, 124);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.28, bgColor);
        grad.addColorStop(1, '#0f172a');

        g.fillStyle = grad;
        g.beginPath();
        g.arc(128, 128, 120, 0, Math.PI * 2);
        g.fill();

        g.lineWidth = 8;
        g.strokeStyle = 'rgba(255,255,255,0.75)';
        g.stroke();

        g.fillStyle = '#ffffff';
        g.font = 'bold 66px Segoe UI, sans-serif';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.shadowColor = 'rgba(0,0,0,0.65)';
        g.shadowBlur = 8;
        g.fillText(label, 128, 132);

        return new THREE.CanvasTexture(c);
    }

    function initScene() {
        scene = new THREE.Scene();
        camera3D = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera3D.position.set(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        raycaster = new THREE.Raycaster();

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dir = new THREE.DirectionalLight(0xffffff, 1.2);
        dir.position.set(5, 10, 6);
        scene.add(dir);

        // Ориентиры в пространстве: колонны-укрытия и тумбы на расстоянии 7–12 метров
        const blockerMat = new THREE.MeshStandardMaterial({
            color: 0x1e293b, transparent: true, opacity: 0.55, roughness: 0.5
        });
        const edgeMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.75 });

        const blockers = [
            // Колонна впереди-слева (закрывает тайник №1 за собой)
            { x: -3.2, y: -0.4, z: -8.0, w: 1.6, h: 4.5, d: 1.2 },
            // Тумба впереди-справа (тайник №2 стоит сверху на ней)
            { x:  3.4, y: -2.0, z: -8.5, w: 2.0, h: 1.4, d: 2.0 },
            // Колонна справа (закрывает тайник №3 за собой)
            { x:  7.5, y: -0.4, z: -3.5, w: 1.6, h: 4.5, d: 1.2 },
            // Тумба слева (тайник №4 стоит сверху на ней)
            { x: -7.5, y: -2.0, z: -3.5, w: 2.0, h: 1.4, d: 2.0 }
        ];

        blockers.forEach(b => {
            const geo = new THREE.BoxGeometry(b.w, b.h, b.d);
            const mesh = new THREE.Mesh(geo, blockerMat);
            mesh.position.set(b.x, b.y, b.z);
            mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
            scene.add(mesh);
        });

        // Статичные тайники на дистанции (не вплотную к камере!)
        const cacheConfigs = [
            // Спрятан ЗА левой колонной (глубже по Z)
            { id: 1, x: -3.2, y: -0.4, z: -9.8 },
            // Лежит НА правой тумбе
            { id: 2, x:  3.4, y: -1.0, z: -8.5 },
            // Спрятан ЗА правой колонной
            { id: 3, x:  9.2, y: -0.4, z: -3.5 },
            // Лежит НА левой тумбе
            { id: 4, x: -7.5, y: -1.0, z: -3.5 }
        ];

        totalCountEl.innerText = cacheConfigs.length;

        const cacheGeo = new THREE.OctahedronGeometry(0.45, 0);
        cacheConfigs.forEach(cfg => {
            const mat = new THREE.MeshStandardMaterial({
                color: 0xf59e0b,
                emissive: 0x78350f,
                roughness: 0.25,
                metalness: 0.25
            });
            const mesh = new THREE.Mesh(cacheGeo, mat);
            mesh.position.set(cfg.x, cfg.y, cfg.z);
            mesh.userData = { id: cfg.id, opened: false, solved: false };
            scene.add(mesh);
            caches.push(mesh);
        });

        window.addEventListener('resize', () => {
            camera3D.aspect = window.innerWidth / window.innerHeight;
            camera3D.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    function clearAnswers() {
        answerSpheres.forEach(s => scene.remove(s));
        answerSpheres = [];
    }

    function openCache(cacheMesh) {
        if (activeCache && activeCache !== cacheMesh) return;
        clearAnswers();
        activeCache = cacheMesh;
        cacheMesh.userData.opened = true;
        cacheMesh.material.color.setHex(0x38bdf8);

        const q = generateMathQuestion();
        currentCorrect = q.ans;
        taskText.innerText = q.text;
        subText.innerText = "Тапните по сфере с правильным ответом";

        const opts = new Set([q.ans]);
        while (opts.size < 4) {
            let delta = Math.floor(Math.random() * 7) - 3;
            if (delta === 0) delta = 4;
            let fake = Number.isInteger(q.ans) ? q.ans + delta : +(q.ans + delta * 0.5).toFixed(1);
            opts.add(fake);
        }

        const list = Array.from(opts).sort(() => Math.random() - 0.5);
        const colors = ['#0ea5e9', '#8b5cf6', '#ec4899', '#10b981'];

        const offsets = [
            { x: -1.1, y:  0.65, z: 0.3 },
            { x:  1.1, y:  0.65, z: 0.3 },
            { x: -1.0, y: -0.55, z: 0.4 },
            { x:  1.0, y: -0.55, z: 0.4 }
        ];

        list.forEach((val, idx) => {
            const tex = makeSphereTexture(val.toString().replace('.', ','), colors[idx]);
            const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(0.38, 28, 28),
                new THREE.MeshStandardMaterial({ map: tex, roughness: 0.25 })
            );
            sphere.position.copy(cacheMesh.position);
            sphere.userData = {
                value: val,
                targetPos: cacheMesh.position.clone().add(new THREE.Vector3(offsets[idx].x, offsets[idx].y, offsets[idx].z))
            };
            scene.add(sphere);
            answerSpheres.push(sphere);
        });
    }

    function updateStatusByDistance() {
        if (activeCache) return;
        const nearest = caches
            .filter(c => !c.userData.solved)
            .map(c => ({ mesh: c, dist: c.position.distanceTo(camera3D.position) }))
            .sort((a, b) => a.dist - b.dist)[0];

        if (!nearest) {
            taskText.innerText = "Все тайники открыты!";
            subText.innerText = `Итоговый счёт: ${score}`;
            return;
        }

        const d = nearest.dist.toFixed(1);
        if (nearest.dist <= 4.5) {
            openCache(nearest.mesh);
        } else {
            taskText.innerText = "Ищите тайники в окружении";
            subText.innerText = `Ближайший тайник в ${d} м • Подойдите ближе (<= 4.5 м)`;
        }
    }

    // Шаг вперёд/назад вдоль текущего направления взгляда
    document.getElementById('stepFwdBtn').addEventListener('click', () => {
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera3D.quaternion);
        camera3D.position.addScaledVector(dir, 1.8);
        updateStatusByDistance();
    });

    document.getElementById('stepBackBtn').addEventListener('click', () => {
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera3D.quaternion);
        camera3D.position.addScaledVector(dir, -1.8);
        updateStatusByDistance();
    });

    document.getElementById('resetPosBtn').addEventListener('click', () => {
        camera3D.position.set(0, 0, 0);
        yaw = 0;
        pitch = 0;
        gyroOffsetYaw = 0;
        gyroOffsetPitch = 0;
        updateStatusByDistance();
    });

    // Свайп для поворота взгляда
    canvas.addEventListener('pointerdown', (e) => {
        isDragging = true;
        dragMoved = false;
        prevX = e.clientX;
        prevY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - prevX;
        const dy = e.clientY - prevY;
        if (Math.hypot(dx, dy) > 6) dragMoved = true;
        prevX = e.clientX;
        prevY = e.clientY;

        yaw -= dx * 0.005;
        pitch = Math.max(-1.1, Math.min(1.1, pitch - dy * 0.005));
    });

    canvas.addEventListener('pointerup', (e) => {
        isDragging = false;
        if (dragMoved || !scene || !camera3D) return;

        const rect = canvas.getBoundingClientRect();
        const pointer = new THREE.Vector2(
            ((e.clientX - rect.left) / rect.width) * 2 - 1,
            -((e.clientY - rect.top) / rect.height) * 2 + 1
        );
        raycaster.setFromCamera(pointer, camera3D);

        if (activeCache && answerSpheres.length > 0) {
            const hitsAns = raycaster.intersectObjects(answerSpheres, false);
            if (hitsAns.length > 0) {
                const chosen = hitsAns[0].object.userData.value;
                if (chosen === currentCorrect) {
                    score += 15;
                    foundTotal++;
                    scoreEl.innerText = score;
                    foundCountEl.innerText = foundTotal;
                    activeCache.userData.solved = true;
                    activeCache.material.color.setHex(0x22c55e);
                    showFeedback("Верно! +15", true);
                } else {
                    score = Math.max(0, score - 5);
                    scoreEl.innerText = score;
                    activeCache.userData.opened = false;
                    activeCache.material.color.setHex(0xf59e0b);
                    showFeedback("Неверно! -5", false);
                }
                clearAnswers();
                activeCache = null;
                updateStatusByDistance();
                return;
            }
        }

        const availableCaches = caches.filter(c => !c.userData.solved);
        const hitsCache = raycaster.intersectObjects(availableCaches, false);
        if (hitsCache.length > 0) {
            const target = hitsCache[0].object;
            if (target.position.distanceTo(camera3D.position) <= 4.5) {
                openCache(target);
            } else {
                subText.innerText = "Слишком далеко — нажмите «Шаг вперёд»";
            }
        }
    });

    function animate() {
        requestAnimationFrame(animate);

        camera3D.rotation.order = 'YXZ';
        camera3D.rotation.y = yaw + gyroOffsetYaw;
        camera3D.rotation.x = Math.max(-1.2, Math.min(1.2, pitch + gyroOffsetPitch));

        caches.forEach(c => {
            if (!c.userData.solved) {
                c.rotation.y += 0.006;
            }
        });

        answerSpheres.forEach(s => {
            s.position.lerp(s.userData.targetPos, 0.14);
            s.lookAt(camera3D.position);
        });

        renderer.render(scene, camera3D);
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment' },
                audio: false
            });
            video.srcObject = stream;
        } catch (err) {
            console.warn('Камера недоступна:', err);
        }

        if (window.DeviceOrientationEvent) {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
            }
            window.addEventListener('deviceorientation', (e) => {
                if (e.beta === null || e.gamma === null) return;
                if (lastGyroBeta === null) {
                    lastGyroBeta = e.beta;
                    lastGyroGamma = e.gamma;
                    return;
                }
                const dGamma = e.gamma - lastGyroGamma;
                const dBeta = e.beta - lastGyroBeta;
                lastGyroGamma = e.gamma;
                lastGyroBeta = e.beta;

                // Небольшая добавка от наклона без залипания к экрану
                gyroOffsetYaw = Math.max(-0.5, Math.min(0.5, gyroOffsetYaw - THREE.MathUtils.degToRad(dGamma) * 0.4));
                gyroOffsetPitch = Math.max(-0.4, Math.min(0.4, gyroOffsetPitch - THREE.MathUtils.degToRad(dBeta) * 0.4));
            });
        }

        startScreen.style.display = 'none';
        hud.style.display = 'block';
        reticle.style.display = 'block';
        controls.style.display = 'flex';

        initScene();
        updateStatusByDistance();
        animate();
    });
</script>
</body>
</html>
